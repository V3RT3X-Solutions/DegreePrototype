<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degree Map</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#eef2f6; --text:#0f172a; --muted:#526070; --border:#d5dce5;
  --complete:#15803d; --progress:#b45309; --needed:#1e293b; --eligible:#0284c7; --accent:#7c3aed;
  --complete-bg:#e3f6ea; --progress-bg:#fff3d6; --needed-bg:#eef2f6;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#121820; --surface2:#1a222c; --text:#e8eef5; --muted:#9aa7b6; --border:#2a3441;
  --complete:#3ccf7a; --progress:#f5b938; --needed:#dbe3ec; --eligible:#38bdf8; --accent:#a78bfa;
  --complete-bg:#0f2d1d; --progress-bg:#33260a; --needed-bg:#1a222c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
header.top{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.credit{min-width:280px}
.credit .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.credit .row b{color:var(--text);font-size:17px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex;border:1px solid var(--border)}
.bar span{display:block;height:100%}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{padding:6px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);min-width:84px}
.tile b{display:block;font-size:19px;line-height:1.15}
.tile small{color:var(--muted);font-size:12px;white-space:nowrap}
.toolbar{display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
.btn{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover,.seg button:hover:not([aria-pressed="true"]){background:var(--surface2)}
.btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.search{position:relative}
.search input{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;width:230px}
.search input:focus{outline:2px solid var(--eligible);outline-offset:1px}
.spacer{flex:1}
main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
#svg .node{cursor:pointer}
#svg .node,#svg .edge{transition:opacity .2s}
#tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-size:13px;max-width:300px;opacity:0;transition:opacity .12s;z-index:5}
#tooltip b{font-size:14px}
#tooltip .t{color:var(--muted)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 28px)}
.legend summary{cursor:pointer;font-weight:600;list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:" ▾";color:var(--muted)}
.legend:not([open]) summary::after{content:" ▸"}
.legend .grid{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin-top:8px}
.legend .secs-grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px}
.legend .lg-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 6px}
.legend button.sec{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;text-align:left}
.legend button.sec:hover{text-decoration:underline}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px;vertical-align:baseline}
.sw.big{width:16px;height:16px;margin:0}
#tooltip .secs{margin-top:4px;font-size:12.5px;color:var(--muted)}
.chip .sw{margin-right:0}
.legend .it{display:flex;align-items:center;gap:8px;white-space:nowrap}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:38px;height:38px;padding:0;font-size:18px;box-shadow:var(--shadow);background:var(--surface)}
.viewnote{position:absolute;left:14px;top:12px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;max-width:calc(100% - 28px)}
aside#panel{width:380px;flex:none;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:18px 20px 40px}
#panel h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.01em}
#panel h3{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#panel .title{margin:0;color:var(--muted);font-size:15px}
#panel p{margin:6px 0}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#panel li:last-child{border-bottom:0}
#panel .req{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
.pill.complete{color:var(--complete);background:var(--complete-bg);border-color:var(--complete)}
.pill.in_progress{color:var(--progress);background:var(--progress-bg);border-color:var(--progress)}
.pill.needed{color:var(--needed);background:var(--needed-bg);border-color:var(--needed)}
.pill.elig{color:var(--eligible);border-color:var(--eligible);background:transparent}
.pill.muted{color:var(--muted);border-color:var(--border);background:transparent;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.facts div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 10px}
.facts dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:2px 0 0;font-weight:600;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:13px;background:var(--bg);cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--text)}
.chip.ext{cursor:default;color:var(--muted);font-weight:500;border-style:dashed}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.complete{background:var(--complete)} .dot.in_progress{background:var(--progress)} .dot.needed{background:transparent;border:2px solid var(--needed)} .dot.ext{background:transparent;border:2px dashed var(--muted)}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.group .ok{margin-left:auto;font-size:12px;font-weight:600}
.and{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 6px 4px}
.or{font-size:12px;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);border-left:3px solid var(--border);padding-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
a.ext{color:var(--eligible);font-weight:600;text-decoration:none;font-size:14px}
a.ext:hover{text-decoration:underline}
.note{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--text);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.hint{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid var(--border);padding-top:12px}
kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
@media (max-width:900px){
  body{overflow:auto}
  main{flex-direction:column}
  #stage{min-height:70vh}
  aside#panel{width:auto;border-left:0;border-top:1px solid var(--border)}
  header.top,.toolbar{padding-left:16px;padding-right:16px}
  .search input{width:100%}
  .search{flex:1;min-width:180px}
  .credit{min-width:0;width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>B.S. Computer Science: Degree Map</h1>
    <p>University of Georgia · Franklin College of Arts &amp; Sciences · Fall 2026 Bulletin · from DegreeWorks audit dated 10/03/2026</p>
  </div>
  <div class="stats">
    <div class="credit">
      <div class="row"><span>Credits applied to degree</span><span><b id="credApplied">–</b> / <span id="credReq">121</span></span></div>
      <div class="bar" id="credBar"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</header>
<div class="toolbar">
  <div class="seg" role="group" aria-label="Filter">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="needed" aria-pressed="false">Needed</button>
    <button data-filter="in_progress" aria-pressed="false">In progress</button>
    <button data-filter="complete" aria-pressed="false">Complete</button>
    <button data-filter="eligible" aria-pressed="false">Eligible now</button>
  </div>
  <div class="search">
    <input id="search" type="search" list="courseList" placeholder="Jump to course, e.g. CSCI 2720" autocomplete="off" aria-label="Search courses">
    <datalist id="courseList"></datalist>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="arrows" aria-pressed="true" title="Show prerequisite arrows">Prereq arrows</button>
  <button class="btn" id="relayout" title="Re-run the layout">Reset layout</button>
  <button class="btn" id="redact" aria-pressed="false" title="Show course codes only">Redact titles</button>
  <button class="btn" id="theme">Dark theme</button>
  <button class="btn" id="export">Export PNG</button>
</div>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Degree graph"></svg>
    <div class="viewnote" id="viewnote"></div>
    <div id="tooltip"></div>
    <details class="legend" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
    <div class="zoom">
      <button class="btn" id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="btn" id="zfit" title="Fit to screen (F)" aria-label="Fit to screen">⤢</button>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<script>
(() => {

// Block status is derived in code from its children (per project brief).
function deriveStatus(list) {
  if (list.length && list.every(s => s === "complete")) return "complete";
  if (list.some(s => s === "complete" || s === "in_progress")) return "in_progress";
  return "needed";
}
for (const [id, c] of Object.entries(CHOICES))
  ITEMS.set(id, { id, type: "choice", ...c, status: deriveStatus(c.options.map(o => ITEMS.get(o).status)) });

const MEMBER = new Map(); // item id -> [{block, req}]
for (const b of BLOCKS) {
  for (const [id, req] of b.items) {
    if (!ITEMS.has(id)) throw new Error("Unknown item " + id);
    if (!MEMBER.has(id)) MEMBER.set(id, []);
    MEMBER.get(id).push({ block: b.id, req });
  }
  ITEMS.set(b.id, { ...b, type: "block", childIds: b.items.map(i => i[0]),
    status: deriveStatus(b.items.map(([id]) => ITEMS.get(id).status)) });
}
for (const [cid, c] of Object.entries(CHOICES))
  for (const o of c.options) {

  status: deriveStatus(BLOCKS.filter(b => b.counts !== false).map(b => ITEMS.get(b.id).status)) });

// Prerequisite / progression edges: only between items that are in the graph.
const EDGES = [];
for (const [code, p] of Object.entries(PRE)) {
  if (!ITEMS.has(code)) continue;
  for (const g of p.pre || []) {
    const inG = g.filter(c => ITEMS.has(c));
    inG.forEach(s => EDGES.push({ s, t: code, kind: inG.length > 1 ? "alt" : "prereq" }));

const IN = new Map(), OUT = new Map();
for (const e of EDGES) {

  if (!OUT.has(e.s)) OUT.set(e.s, []); OUT.get(e.s).push(e);
}

function closure(id, dir) {
  const nodes = new Set(), edges = new Set(), stack = [id];
  while (stack.length) {
    const v = stack.pop();
    for (const e of (dir === "up" ? IN : OUT).get(v) || []) {
      edges.add(e);
      const w = dir === "up" ? e.s : e.t;
      if (!nodes.has(w)) { nodes.add(w); stack.push(w); }
    }

  return { nodes, edges };
}

// Eligibility (strict prerequisites only; pre-or-coreqs may be taken together).
//  now     = needed, every prerequisite group has a completed course
//  next    = needed, every group has a completed or in-progress course
//  blocked = needed, something is still missing
function prereqGroupsState(code) {
  const p = PRE[code];
  if (!p || !p.pre) return "now";
  let now = true, next = true;
  for (const g of p.pre) {
    const sts = g.filter(c => ITEMS.has(c)).map(c => ITEMS.get(c).status);
    if (!sts.includes("complete")) now = false;
    if (!sts.some(s => s === "complete" || s === "in_progress")) next = false;

for (const it of ITEMS.values()) {

/* =====================================================================

   Hubs = audit sections. Each item is linked to every section it counts

const HUB_ORDER = ["BLK:A1", "BLK:A4", "BLK:UNIV", "BLK:A5", "BLK:FRANK", "BLK:A2", "BLK:EXCESS", "BLK:A3", "BLK:ENTR", "BLK:A6", "BLK:MAJOR", "BLK:GENEL"];

function buildSim() {

  for (const it of ITEMS.values()) if (!SIM.byId.has(it.id)) add(it.id);
  const link = (s, t, kind, e) => SIM.links.push({ s: SIM.byId.get(s), t: SIM.byId.get(t), kind, e });
  BLOCKS.forEach(b => link("DEGREE", b.id, "spine"));
  BLOCKS.forEach(b => b.items.forEach(([id]) => link(b.id, id, "member")));
  Object.entries(CHOICES).forEach(([cid, c]) => c.options.forEach(o => link(cid, o, "option")));
  EDGES.forEach(e => { if (!(e.kind === "fulfills" && CHOICES[e.t])) link(e.s, e.t, "pre", e); });

  const struct = new Map(), all = new Map();
  const inc = (m, n) => m.set(n, (m.get(n) || 0) + 1);
  SIM.links.forEach(l => { inc(all, l.s); inc(all, l.t); if (l.kind !== "pre") { inc(struct, l.s); inc(struct, l.t); } });
  SIM.links.forEach(l => {

    else if (l.kind === "member") { l.dist = l.s.r + l.t.r + 58; l.str = 0.8 / dt; }
    else if (l.kind === "option") { l.dist = l.s.r + l.t.r + 40; l.str = 0.8; }
    else { l.dist = l.s.r + l.t.r + 80; l.str = 0.035; }

function seedPositions() {
  const r0 = mulberry32(20261007);
  HUB_ORDER.forEach((id, i) => {
    const a = -Math.PI / 2 + i / HUB_ORDER.length * 2 * Math.PI, n = SIM.byId.get(id);
    Object.assign(n, { x: Math.cos(a) * 440, y: Math.sin(a) * 440, vx: 0, vy: 0, fx: null, fy: null });
  });
  Object.assign(SIM.byId.get("DEGREE"), { x: 0, y: 0, fx: 0, fy: 0 });
  SIM.nodes.forEach(n => {
    n.jx = n.jy = n.jvx = n.jvy = 0;
    if (n.it.type === "block" || n.it.type === "degree") return;
    const hubs = blocksOf(n.id).map(b => SIM.byId.get(b));
    const hx = hubs.reduce((s, h) => s + h.x, 0) / hubs.length, hy = hubs.reduce((s, h) => s + h.y, 0) / hubs.length;

function tick() {

    const d = Math.hypot(dx, dy) || 1e-6, k = (d - l.dist) / d * a * l.str;
    dx *= k; dy *= k;
    t.vx -= dx * l.bias; t.vy -= dy * l.bias;
    s.vx += dx * (1 - l.bias); s.vy += dy * (1 - l.bias);
  }
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const p = N[i], q = N[j];
    let dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
    if (d2 > 810000) continue;
    if (d2 < 1) { dx = (rnd() - 0.5) * 1e-3 + 1e-3; dy = (rnd() - 0.5) * 1e-3; d2 = 1; }
    p.vx += dx * q.charge * a / d2; p.vy += dy * q.charge * a / d2;
    q.vx -= dx * p.charge * a / d2; q.vy -= dy * p.charge * a / d2;
    const rr = p.r + p.pad + q.r + q.pad, d = Math.sqrt(d2);
    if (d < rr) {

      p.vx -= dx * k; p.vy -= dy * k; q.vx += dx * k; q.vy += dy * k;

  for (const n of N) {
    if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
    n.vx -= n.x * 0.012 * a; n.vy -= n.y * 0.012 * a;
    n.vx *= 1 - SIM.vDecay; n.vy *= 1 - SIM.vDecay;

/* Hover "jiggle": a separate damped spring offset per node, so nodes wobble
   and always return to where the layout put them. */
function stepJiggle() {
  let energy = 0;
  for (const n of SIM.nodes) {
    if (!n.jx && !n.jy && !n.jvx && !n.jvy) continue;
    n.jvx = (n.jvx - n.jx * 0.14) * 0.85; n.jvy = (n.jvy - n.jy * 0.14) * 0.85;
    n.jx += n.jvx; n.jy += n.jvy;
    const e = Math.abs(n.jx) + Math.abs(n.jy) + Math.abs(n.jvx) + Math.abs(n.jvy);
    if (e < 0.02) n.jx = n.jy = n.jvx = n.jvy = 0; else energy += e;

  src.lastJ = now;

  for (const m of SIM.nodes) {
    if (m === src || m.it.type === "degree") continue;
    const dx = m.x - src.x, dy = m.y - src.y, d = Math.hypot(dx, dy) || 1;
    const isAdj = adj.has(m.id);

    const mag = (isAdj ? 4.2 : 3) * Math.max(0.35, 1 - d / 320) * (m.it.type === "block" ? 0.5 : 1);

const eligPill = e => e === "now" ? `<span class="pill elig">Eligible now</span>` : e === "next" ? `<span class="pill elig" style="border-style:dashed">Eligible after this term</span>` : e === "blocked" ? `<span class="pill muted">Prerequisites not met</span>` : "";
const ELIG_TEXT = { now: "Now", next: "After this term", blocked: "Not yet" };
const membersHTML = id => `<ul>${(MEMBER.get(id) || []).map(m => `<li>${swatch(m.block)}<button class="linkbtn" data-go="${m.block}">${esc(ITEMS.get(m.block).short)}</button><span class="req">${esc(m.req)}</span></li>`).join("")}</ul>`;

function groupsHTML(groups) {
  return groups.map((g, i) => {
    const sts = g.filter(c => ITEMS.has(c)).map(c => ITEMS.get(c).status);
    const ok = sts.includes("complete") ? ["complete", "Met"] : sts.includes("in_progress") ? ["progress", "In progress"] : ["muted", "Not met"];
    const chips = g.map(chip).join(`<span class="or">or</span>`);
    return (i ? `<div class="and">and</div>` : "") + `<div class="group">${chips}<span class="ok" style="color:var(--${ok[0]})">${ok[1]}</span></div>`;
  }).join("");
}

function renderPanel() {
  const id = state.sel;
  if (!id) return panel.innerHTML = overviewHTML();
  const it = ITEMS.get(id);
  let h = "";
  if (it.type === "course") {
    const p = PRE[id], e = elig(id), shared = blocksOf(id).length;
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap">${pill(it.status)}${eligPill(e)}</div>`;
    h += `<h2>${esc(id)}</h2>${state.redact ? "" : `<p class="title">${esc(it.title)}</p>`}`;
    h += `<dl class="facts"><div><dt>Credits</dt><dd>${it.credits}</dd></div><div><dt>Status</dt><dd>${STATUS_LABEL[it.status]}</dd></div><div><dt>Can take</dt><dd>${it.status === "needed" ? ELIG_TEXT[e] : "—"}</dd></div></dl>`;
    h += `<h3>Counts toward${shared > 1 ? ` · shared by ${shared} sections` : ""}</h3>${membersHTML(id)}`;
    h += `<h3>Prerequisites</h3>`;
    if (p && p.pre) h += groupsHTML(p.pre) + `<p class="src">Bulletin${p.undergrad ? " (undergraduate prerequisite)" : ""}: ${esc(p.text)}</p>`;
    else h += `<p class="note">${it.bid ? "None listed in the Bulletin." : "Transfer / test-credit placeholder; not a Bulletin course."}</p>`;
    if (p && p.preco) h += `<h3>Pre- or corequisite</h3>${groupsHTML(p.preco)}<p class="src">Bulletin: ${esc(p.precoText)}</p>`;
    if (p && p.coText) h += `<h3>Corequisite</h3><div class="chips">${chip(p.coText)}</div>`;
    const outs = OUT.get(id) || [], down = closure(id, "down").nodes;
    h += `<h3>Unlocks</h3>`;
    h += outs.length ? `<div class="chips">${outs.map(o => chip(o.t)).join("")}</div><p class="note">${down.size} item${down.size === 1 ? "" : "s"} downstream in total (pink arrows).</p>` : `<p class="note">Nothing in this audit lists ${esc(id)} as a prerequisite.</p>`;
    if (it.bid) h += `<p style="margin-top:16px"><a class="ext" href="https://bulletin.uga.edu/Course/Details/${it.bid}" target="_blank" rel="noopener">View in UGA Bulletin ↗</a></p>`;
  } else if (it.type === "req") {
    h += `<div>${pill(it.status)}</div><h2>${esc(it.label)}</h2><p class="title">${esc(it.sub)}</p>`;
    h += `<h3>Counts toward</h3>${membersHTML(id)}`;
    h += `<h3>From the audit</h3><p>${esc(it.desc)}</p>`;
    if (it.from) {
      const done = it.from.filter(c => ITEMS.get(c).status === "complete").length, ip = it.from.filter(c => ITEMS.get(c).status === "in_progress").length;
      h += `<h3>Entrance courses: ${done} of ${it.from.length} complete${ip ? `, ${ip} in progress` : ""}</h3><div class="chips">${it.from.map(chip).join("")}</div>`;
    }
  } else if (it.type === "choice") {
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap">${pill(it.status)}${eligPill(elig(id))}</div><h2>${esc(it.label)}</h2><p class="title">Pick 1 of ${it.options.length}</p>`;
    h += `<h3>Options</h3><ul>${it.options.map(o => `<li>${chip(o)}${state.redact ? "" : `<span class="req">${esc(ITEMS.get(o).title)}</span>`}<span style="margin-left:auto">${eligPill(elig(o))}</span></li>`).join("")}</ul>`;
    if (id === "CHOICE:APP") h += `<p class="note">Both options also satisfy the major's Teamwork requirement.</p>`;
  } else if (it.type === "block") {
    const shared = it.childIds.filter(c => blocksOf(c).length > 1);
    h += `<div>${pill(it.status)} <span class="pill muted">Audit: ${esc(it.audit || (it.counts === false ? "not counted" : "—"))}</span></div><h2 style="display:flex;align-items:center;gap:10px">${swatch(it.id).replace('class="sw"', 'class="sw big"')}${esc(it.short)}</h2><p class="title">${esc(it.label)}</p>`;
    if (it.applied != null) h += `<dl class="facts"><div><dt>Required</dt><dd>${it.req != null ? esc(it.req) + " cr" : "—"}</dd></div><div><dt>Applied</dt><dd>${it.applied} cr</dd></div><div><dt>Items</dt><dd>${it.childIds.length}</dd></div></dl>`;
    h += `<h3>Requirements</h3><ul>${it.items.map(([cid, req]) => `<li>${chip(cid)}<span class="req">${esc(req)}</span></li>`).join("")}</ul>`;
    if (shared.length) h += `<h3>Shared with other sections</h3><ul>${shared.map(c => `<li>${chip(c)}<span class="req">${blocksOf(c).filter(b => b !== it.id).map(b => swatch(b) + esc(ITEMS.get(b).short)).join(", ")}</span></li>`).join("")}</ul>`;
    if (it.notes) h += `<h3>Notes from the audit</h3>${it.notes.map(n => `<p class="note">${esc(n)}</p>`).join("")}`;
    h += `<p class="note" style="margin-top:14px">Section status is derived from its items: all complete → complete; some started → in progress; none started → needed.</p>`;
  } else {
    h += overviewHTML();
  }
  panel.innerHTML = h + `<p class="hint"><button class="linkbtn" data-go="">← Back to overview</button> &nbsp;or press <kbd>Esc</kbd></p>`;
}

function overviewHTML() {
  const all = [...ITEMS.values()];
  const now = [...ELIG].filter(([id, e]) => e === "now" && ITEMS.get(id).type === "course").map(([id]) => id);
  const next = [...ELIG].filter(([id, e]) => e === "next" && ITEMS.get(id).type === "course").map(([id]) => id);
  const required = BLOCKS.flatMap(b => b.items.map(i => i[0])).filter((v, i, a) => a.indexOf(v) === i);
  const reqCourses = required.filter(id => ITEMS.get(id).type === "course" && ITEMS.get(id).status === "needed");
  const groups = required.filter(id => ITEMS.get(id).type === "choice" && ITEMS.get(id).status === "needed");
  const open = required.filter(id => ITEMS.get(id).type === "req");
  const inProg = all.filter(i => i.type === "course" && i.status === "in_progress").map(i => i.id);
  const shared = all.filter(i => i.type !== "block" && i.type !== "degree" && blocksOf(i.id).length > 1).map(i => i.id);
  let h = `<h2 style="font-size:20px">Overview</h2><p class="note">Each colored cloud is an audit section. Courses that count toward more than one section sit between those hubs and wear every section's color. Click any node for details; blue arrows lead into it, pink arrows lead out.</p>`;
  h += `<h3>Sections (${BLOCKS.length})</h3><div class="chips">${BLOCKS.map(b => chip(b.id)).join("")}</div>`;
  h += `<h3>Eligible now (${now.length})</h3>` + (now.length ? `<div class="chips">${now.map(chip).join("")}</div><p class="note">Needed, and every prerequisite is complete.</p>` : `<p class="note">None.</p>`);
  h += `<h3>Eligible after this term (${next.length})</h3>` + (next.length ? `<div class="chips">${next.map(chip).join("")}</div><p class="note">Unlocks once your in-progress courses finish.</p>` : `<p class="note">None.</p>`);
  h += `<h3>In progress (${inProg.length})</h3><div class="chips">${inProg.map(chip).join("")}</div>`;
  h += `<h3>Required courses still needed (${reqCourses.length})</h3><div class="chips">${reqCourses.map(chip).join("")}</div>`;
  h += `<h3>Pick-one groups (${groups.length})</h3><div class="chips">${groups.map(chip).join("")}</div>`;
  h += `<h3>Open requirements (${open.length})</h3><div class="chips">${open.map(chip).join("")}</div>`;
  h += `<h3>Counted in more than one section (${shared.length})</h3><div class="chips">${shared.map(chip).join("")}</div>`;
  h += `<h3>Degree checks from the audit</h3><ul>${DEGREE.checks.map(([a, b]) => `<li><b>${esc(a)}</b><span class="req">${esc(b)}</span></li>`).join("")}</ul>`;
  h += `<p class="hint">Requirements: DegreeWorks audit (10/03/2026). Prerequisites: UGA Bulletin, checked 10/07/2026. Arrows are drawn only between courses in this audit; other accepted alternatives appear as dashed chips in each course's details.<br><br>Hover to nudge · drag nodes to rearrange · scroll to zoom<br>Shortcuts: <kbd>/</kbd> search · <kbd>F</kbd> fit · <kbd>Esc</kbd> clear</p>`;
  return h;
}
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const id = b.getAttribute("data-go");
  select(id || null, !!id);
});

/* =====================================================================
   HEADER, LEGEND, CONTROLS
   ===================================================================== */
function renderHeader() {
  document.getElementById("credApplied").textContent = credComplete + credIP;
  document.getElementById("credReq").textContent = DEGREE.req;
  document.getElementById("credBar").innerHTML = `<span style="width:${credComplete / DEGREE.req * 100}%;background:var(--complete)" title="${credComplete} complete"></span><span style="width:${credIP / DEGREE.req * 100}%;background:var(--progress)" title="${credIP} in progress"></span>`;
  const nowN = [...ELIG].filter(([id, e]) => e === "now" && ITEMS.get(id).type === "course").length;
  const tiles = [
    [credComplete, "credits complete", "var(--complete)"],
    [credIP, "credits in progress", "var(--progress)"],
    [DEGREE.req - credComplete - credIP, "credits remaining", "var(--text)"],
    ["10 / 39", "upper-division cr", "var(--text)"],
    [nowN, "eligible now", "var(--eligible)"],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([v, l, c]) => `<div class="tile"><b style="color:${c}">${v}</b><small>${l}</small></div>`).join("");
}

function renderLegend() {
  const pal = P(), c = pal.edge;
  const dot = (inner) => `<svg width="22" height="22" viewBox="-11 -11 22 22">${inner}</svg>`;
  const ring = `stroke="${pal.text}" stroke-width="2.2"`;
  const line = (dash, cap) => `<svg width="34" height="12"><line x1="1" y1="6" x2="25" y2="6" stroke="${c}" stroke-width="2.2" ${dash ? `stroke-dasharray="${dash}"` : ""} stroke-linecap="${cap || "butt"}"/><path d="M24,1.5 L33,6 L24,10.5 Z" fill="${c}"/></svg>`;
  const enc = [
    [dot(`<circle r="8" fill="${pal.text}" ${ring}/>`), "Complete (filled)"],
    [dot(`<circle r="8" fill="none" ${ring}/><path d="M-8,0 A8,8 0 0 0 8,0 Z" fill="${pal.text}"/>`), "In progress (half)"],
    [dot(`<circle r="8" fill="none" stroke="${pal.text}" stroke-width="3"/>`), "Needed (empty)"],
    [dot(`<circle r="8" fill="none" ${ring} stroke-dasharray="3 2.5"/>`), "Open req / pick-one"],
    [dot(`<circle r="4" fill="${pal.text}"/><circle r="8.5" fill="none" ${ring}/>`), "Eligible now (pulses)"],
    [dot(`<circle r="4" fill="none" ${ring}/><circle r="8.5" fill="none" stroke="${pal.text}" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>`), "Eligible after this term"],
    [dot(`<path d="M0,-8 A8,8 0 0 1 0,8" fill="none" stroke="${pal.blocks["BLK:A6"]}" stroke-width="3"/><path d="M0,8 A8,8 0 0 1 0,-8" fill="none" stroke="${pal.blocks["BLK:ENTR"]}" stroke-width="3"/>`), "Split ring = shared"],
    [line(), "Prerequisite"],
    [line("6 4"), "One of several options"],
    [line("1.5 4", "round"), "Pre- or corequisite"],
  ].map(([s, l]) => `<div class="it">${s}<span>${l}</span></div>`).join("");
  document.getElementById("legend").innerHTML = `<div class="grid">${enc}</div>`;
}

document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  state.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyVisual();
}));

const arrowsBtn = document.getElementById("arrows");
function syncArrows() { arrowsBtn.setAttribute("aria-pressed", state.arrows); }
arrowsBtn.addEventListener("click", () => { state.arrows = !state.arrows; store.set("arrows", state.arrows ? "1" : "0"); syncArrows(); applyVisual(); });

const redactBtn = document.getElementById("redact");
function syncRedact() { redactBtn.setAttribute("aria-pressed", state.redact); redactBtn.textContent = state.redact ? "Titles hidden" : "Redact titles"; }
redactBtn.addEventListener("click", () => { state.redact = !state.redact; store.set("redact", state.redact ? "1" : "0"); syncRedact(); fillDatalist(); renderPanel(); });

const themeBtn = document.getElementById("theme");
function syncTheme() { document.documentElement.dataset.theme = state.theme; themeBtn.textContent = state.theme === "dark" ? "Light theme" : "Dark theme"; }
themeBtn.addEventListener("click", () => { state.theme = state.theme === "dark" ? "light" : "dark"; store.set("theme", state.theme); syncTheme(); renderLegend(); render(); });

document.getElementById("relayout").addEventListener("click", () => { seedPositions(); draw(); fit(); });
document.getElementById("zin").addEventListener("click", () => zoomBy(1.25));
document.getElementById("zout").addEventListener("click", () => zoomBy(0.8));
document.getElementById("zfit").addEventListener("click", () => fit());

/* Search */
const search = document.getElementById("search");
function fillDatalist() {
  document.getElementById("courseList").innerHTML = [...ITEMS.values()]
    .filter(i => i.type === "course" || i.type === "req" || i.type === "choice")
    .map(i => `<option value="${esc(i.type === "course" ? i.id : i.label)}">${i.type === "course" && !state.redact ? esc(i.title) : ""}</option>`).join("");
}
function findItem(q) {
  const k = q.toUpperCase().replace(/\s+/g, "");
  if (!k) return null;
  const name = it => it.type === "course" ? it.id : it.type === "block" ? it.short : it.label;
  for (const it of ITEMS.values()) if (name(it).toUpperCase().replace(/\s+/g, "") === k) return it.id;
  for (const it of ITEMS.values()) {
    const hay = (name(it) + (it.type === "course" && !state.redact ? " " + it.title : "") + (it.type === "block" ? " " + it.label : "")).toUpperCase();
    if (hay.replace(/\s+/g, "").includes(k)) return it.id;
  }
  return null;
}
function doSearch() {
  const id = findItem(search.value);
  if (id) select(id, true);
  else if (search.value.trim()) { search.style.outline = "2px solid #e11d48"; setTimeout(() => search.style.outline = "", 900); }
}
search.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
search.addEventListener("change", doSearch);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") { e.target.blur(); select(null); } return; }
  if (e.key === "Escape") select(null);
  else if (e.key === "/") { e.preventDefault(); search.focus(); }
  else if (e.key === "f" || e.key === "F") fit();
  else if (e.key === "+" || e.key === "=") zoomBy(1.25);
  else if (e.key === "-") zoomBy(0.8);
});

/* Export the current view as PNG */
document.getElementById("export").addEventListener("click", () => {
  const r = svg.getBoundingClientRect(), scale = 2;
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", NS);
  clone.setAttribute("width", r.width); clone.setAttribute("height", r.height);
  clone.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  clone.querySelectorAll("animate").forEach(a => a.parentNode.remove());
  clone.querySelectorAll(".node,.edge,.selring").forEach(n => n.removeAttribute("class"));
  const data = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = r.width * scale; c.height = r.height * scale;
    const ctx = c.getContext("2d");
    ctx.scale(scale, scale); ctx.fillStyle = P().bg; ctx.fillRect(0, 0, r.width, r.height);
    ctx.drawImage(img, 0, 0, r.width, r.height);
    c.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `degree-map${state.redact ? "-redacted" : ""}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data);
});

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => fit(false), 150); });

/* Boot */
syncTheme(); syncRedact(); syncArrows(); fillDatalist(); renderHeader(); renderLegend();
document.getElementById("viewnote").textContent = "Each colored cloud is one audit section. Shared courses sit where clouds overlap and wear both colors. Hover to nudge, drag to move, click for details.";
buildSim();
render();
fit(false);
requestAnimationFrame(() => fit(false));
})();
</script>
</body>
</html>
