<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degree Map</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#eef2f6; --text:#0f172a; --muted:#526070; --border:#d5dce5;
  /* Course status is one neutral ramp (done recedes, needed stands out); hue is kept for the trace pair and planner checks. */
  --complete:#a3aebc; --progress:#526070; --needed:#0f172a; --eligible:#0f172a; --accent:#0f172a;
  --complete-bg:#eef2f6; --progress-bg:#eef2f6; --needed-bg:transparent;
  --up:#c98500; --down:#2f9e44; --cs:#2a78d6; --gen:#1a9e6e; --other:#7b8797;
  --good:#15803d; --warn:#b45309; --warn-bg:#fff3d6; --bad:#e11d48;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#121820; --surface2:#1a222c; --text:#e8eef5; --muted:#9aa7b6; --border:#2a3441;
  --complete:#4b5666; --progress:#9aa7b6; --needed:#e8eef5; --eligible:#e8eef5; --accent:#e8eef5;
  --complete-bg:#1a222c; --progress-bg:#1a222c; --needed-bg:transparent;
  --up:#facc15; --down:#4ade80; --cs:#3987e5; --gen:#199e70; --other:#8391a3;
  --good:#3ccf7a; --warn:#f5b938; --warn-bg:#33260a; --bad:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
header.top{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.credit{min-width:280px}
.credit .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.credit .row b{color:var(--text);font-size:17px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex;border:1px solid var(--border)}
.bar span{display:block;height:100%}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{padding:6px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);min-width:84px}
.tile b{display:block;font-size:19px;line-height:1.15}
.tile small{color:var(--muted);font-size:12px;white-space:nowrap}
.profile{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.profile>span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
.btn{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover,.seg button:hover:not([aria-pressed="true"]){background:var(--surface2)}
.btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.search{position:relative}
.search input{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;width:230px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
#svg .node{cursor:pointer}
#svg .node,#svg .edge{transition:opacity .2s}
#tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-size:13px;max-width:300px;opacity:0;transition:opacity .12s;z-index:5}
#tooltip b{font-size:14px}
#tooltip .t{color:var(--muted)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px 10px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 84px);max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain}
/* Never taller than the graph area: contents scroll and the header stays pinned, so it can always be closed. */
.legend summary{cursor:pointer;font-weight:600;list-style:none;position:sticky;top:0;z-index:1;background:var(--surface);padding:10px 0 4px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:" ▾";color:var(--muted)}
.legend:not([open]) summary::after{content:" ▸"}
.legend .grid{display:grid;grid-template-columns:auto auto;gap:6px 18px}
.legend .secs-grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px}
.legend .lg-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 6px}
.legend .lg-note{font-size:12px;color:var(--muted);margin:-3px 0 5px}
.legend .lg-sub{font-size:12px;color:var(--muted);margin:2px 0 4px}
.legend .lg-sub~.lg-sub{margin-top:8px}
.legend .grid{grid-template-columns:auto auto}
.legend button.sec{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;text-align:left}
.legend button.sec:hover{text-decoration:underline}
#tooltip .secs{margin-top:4px;font-size:12.5px;color:var(--muted)}
.legend .it{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px}
.chip .sw,.pc-meta .sw{margin-right:0}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:38px;height:38px;padding:0;font-size:18px;box-shadow:var(--shadow);background:var(--surface)}
aside#panel{width:380px;flex:none;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:18px 20px 40px}
#panel h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.01em}
#panel h3{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#panel .title{margin:0;color:var(--muted);font-size:15px}
#panel p{margin:6px 0}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#panel li:last-child{border-bottom:0}
#panel .intro{margin:6px 0 4px;font-size:14px;line-height:1.55}
#panel .req{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
.pill.complete{color:var(--muted);background:var(--complete-bg);border-color:var(--border)}
.pill.in_progress{color:var(--text);background:var(--progress-bg);border-color:var(--progress)}
.pill.needed{color:var(--needed);background:var(--needed-bg);border-color:var(--needed)}
.pill.elig{color:var(--text);border-color:var(--text);background:transparent}
.pill.muted{color:var(--muted);border-color:var(--border);background:transparent;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.facts div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 10px}
.facts dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:2px 0 0;font-weight:600;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:13px;background:var(--bg);cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--text)}
.chip.ext{cursor:default;color:var(--muted);font-weight:500;border-style:dashed}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.complete{background:var(--complete)} .dot.in_progress{background:linear-gradient(to top,var(--progress) 50%,transparent 50%);border:2px solid var(--progress)} .dot.needed{background:transparent;border:2px solid var(--needed)} .dot.ext{background:transparent;border:2px dashed var(--muted)}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.group .ok{margin-left:auto;font-size:12px;font-weight:600}
.and{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 6px 4px}
.or{font-size:12px;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);border-left:3px solid var(--border);padding-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
a.ext{color:var(--accent);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;font-size:14px}
a.ext:hover{text-decoration-color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--text);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.hint{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid var(--border);padding-top:12px}
kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
/* Semester planner */
#planner{display:none;flex:1;min-height:0}
body.mode-plan #stage,body.mode-plan #panel,body.mode-plan .graph-only{display:none!important}
body.mode-plan #planner{display:flex}
.pl-side{width:370px;flex:none;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:16px 18px 40px}
.pl-main{flex:1;min-width:0;overflow:auto;padding:18px 22px 40px}
.pl-h{margin:0 0 6px;font-size:20px}
.pl-side section{margin-top:18px}
.pl-side h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.terms-tbl{width:100%;border-collapse:collapse;font-size:14px}
.terms-tbl th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:2px 4px}
.terms-tbl td{padding:3px 4px;border-top:1px solid var(--border)}
.terms-tbl tr.off td:nth-child(n+2){opacity:.45}
.terms-tbl input[type=number],.bulk input{width:56px;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:3px 6px}
.pl-side select{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13.5px}
.fld{display:block;font-size:13.5px;margin-bottom:8px}
.fld select{margin-top:4px}
.erow{margin-bottom:6px}
.erow.auto select{border-style:dashed}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:5px}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.warn-dot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--bg);font-size:11px;font-weight:800;margin-left:4px}
.pins{margin:0 0 8px;padding:0;list-style:none;font-size:13.5px}
.pins li{padding:3px 0}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.plan-head h2{margin:0;font-size:30px;letter-spacing:-.02em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 16px;margin:6px 0 12px}
.ck{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.ck span{font-weight:800}
.ck.ok span{color:var(--good)} .ck.bad span{color:var(--bad)}
.alert{border-radius:10px;padding:8px 12px;font-size:13.5px;margin:6px 0;border:1px solid}
.alert.warn{border-color:var(--warn);background:var(--warn-bg)}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.terms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px;align-items:start}
.term{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.term-h{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.load{font-weight:800;font-size:15px}
.load.ok{color:var(--text)} .load.warn{color:var(--warn)} .load.bad{color:var(--bad)}
.tbar{position:relative;height:6px;border-radius:4px;background:var(--surface2);margin:8px 0 4px}
.tbar span{display:block;height:100%;border-radius:4px;background:var(--text);opacity:.7}
.tbar i{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted)}
.tbar i.mx{background:var(--text)}
.tsub{font-size:12px;color:var(--muted);margin-bottom:8px}
.pcard{border:1px solid var(--border);border-left:4px solid var(--c,var(--border));border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--bg)}
.pc-top{display:flex;justify-content:space-between;font-size:15px}
.pc-top span{color:var(--muted);font-size:13px;font-weight:600}
.pc-t{font-size:13px;color:var(--muted);margin-top:1px}
.pc-meta{font-size:12px;color:var(--muted);margin-top:5px}
.pc-pre{font-size:12px;margin-top:4px}
.pc-flag{font-size:12px;margin-top:4px;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--text)}
.pc-foot{display:flex;gap:8px;align-items:center;margin-top:7px}
.pc-foot select{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:12.5px;max-width:170px}
.pc-foot .lock{font-size:12px}
a.ext.sm{font-size:12.5px;margin-left:auto}
.assume{margin-top:18px;font-size:13.5px;color:var(--muted)}
.assume summary{cursor:pointer;font-weight:600;color:var(--text)}
.planned{background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:12px;font-size:14px}
@media (max-width:900px){
  body.mode-plan #planner{flex-direction:column}
  .pl-side{width:auto;border-right:0;border-bottom:1px solid var(--border)}
  body{overflow:auto}
  main{flex-direction:column}
  #stage{min-height:70vh}
  aside#panel{width:auto;border-left:0;border-top:1px solid var(--border)}
  header.top,.toolbar{padding-left:16px;padding-right:16px}
  .search input{width:100%}
  .search{flex:1;min-width:180px}
  .credit{min-width:0;width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>B.S. Computer Science: Degree Map</h1>
    <p id="sourceLine">University of Georgia · Sources: DegreeWorks audit (10/03/2026), Fall 2026 UGA Bulletin (retrieved 10/07/2026)</p>
  </div>
  <div class="stats">
    <div class="credit">
      <div class="row"><span>Credits applied to degree</span><span><b id="credApplied">–</b> / <span id="credReq">121</span></span></div>
      <div class="bar" id="credBar"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="profile">
      <span>Profile</span>
      <div class="seg" role="group" aria-label="Profile">
        <button data-profile="vivek" aria-pressed="false">Vivek</button>
        <button data-profile="hypothetical" aria-pressed="false">Hypothetical</button>
      </div>
    </div>
  </div>
</header>
<div class="toolbar">
  <div class="seg" role="group" aria-label="View">
    <button data-mode="graph" aria-pressed="true">Degree graph</button>
    <button data-mode="plan" aria-pressed="false">Semester plan</button>
  </div>
  <div class="seg graph-only" role="group" aria-label="Filter">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="needed" aria-pressed="false">Needed</button>
    <button data-filter="in_progress" aria-pressed="false">In progress</button>
    <button data-filter="complete" aria-pressed="false">Complete</button>
    <button data-filter="eligible" aria-pressed="false">Eligible now</button>
  </div>
  <div class="search graph-only">
    <input id="search" type="search" list="courseList" placeholder="Jump to course, e.g. CSCI 2720" autocomplete="off" aria-label="Search courses">
    <datalist id="courseList"></datalist>
  </div>
  <div class="spacer"></div>
  <button class="btn graph-only" id="relayout" title="Re-run the layout">Reset layout</button>
  <button class="btn" id="redact" aria-pressed="false" title="Show course codes only">Redact titles</button>
  <button class="btn" id="theme">Dark theme</button>
  <button class="btn graph-only" id="export">Export PNG</button>
</div>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Degree graph"></svg>
    <div id="tooltip"></div>
    <details class="legend" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
    <div class="zoom">
      <button class="btn" id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="btn" id="zfit" title="Fit to screen (F)" aria-label="Fit to screen">⤢</button>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
  <div id="planner"></div>
</main>

<script>
(() => {
'use strict';

/* =====================================================================
   DATA
   Two hard-coded profiles share one degree structure (the same 12 audit
   sections) and one prerequisite layer (PRE, from the Bulletin):
   - "Vivek": hand-transcribed from a real DegreeWorks audit (PDF). Only course
     codes, titles, credits, status and requirement names are kept. No name,
     ID, GPA, grades, terms or transfer sources.
   - "Hypothetical": a fictional student, further along, built so every legend
     case appears at least once.
   Prerequisite layer: UGA Bulletin (bulletin.uga.edu), retrieved 2026-10-07.
   The selected profile is stored in localStorage; switching reloads the page.
   ===================================================================== */
const PROFILE_ID = (() => { try { const v = localStorage.getItem("degmap:profile"); return v === "hypothetical" ? v : "vivek"; } catch { return "vivek"; } })();

/* ---------- Profile 1: Vivek (real audit, dated 10/03/2026) ---------- */

// code: [title, credits, status, Bulletin course-detail id | null]
// Titles are the full Bulletin titles where the course exists in the Bulletin;
// transfer/test placeholders keep the title shown on the audit.
const VIVEK_COURSES = {

  "CSCI 4050":  ["Software Engineering", 4, "needed", 4181],
  "CSCI 4370":  ["Database Management", 4, "needed", 4302],
  "CSCI 4570":  ["Compilers", 4, "needed", 4202],
  "CSCI 4730":  ["Operating Systems", 4, "needed", 4253],
  "CSCI 4760":  ["Computer Networks", 4, "needed", 4759],
  "CSCI 1TTS":  ["Test Score Credit", 4, "complete", null],
  "MATH 1113":  ["Precalculus", 0, "complete", 859],
  "MATH 1101":  ["Introduction to Mathematical Modeling", 0, "complete", 818],
  "MATH 2250":  ["Calculus I for Science and Engineering", 4, "complete", 17372],
  "MATH 2260":  ["Calculus II for Science and Engineering", 4, "complete", 17373],
  "MATH 2270":  ["Calculus III for Science and Mathematics", 4, "complete", 26520],
  "MATH 3300":  ["Applied Linear Algebra", 3, "complete", 28109],
  "MATH 3200":  ["Introduction to Higher Mathematics", 3, "in_progress", 974],
  "MATH 2003":  ["Arithmetic for Elementary Sch", 3, "complete", null],
  "MATH 3TXX":  ["Transfer Elective", 1, "complete", null],
  "STAT 2000":  ["Introductory Statistics", 4, "complete", 2514],
  "ENGL 1101":  ["English Composition I", 3, "complete", 4619],
  "ENGL 1102":  ["English Composition II", 3, "complete", 4631],
  "CHEM 1211":  ["General Chemistry I", 3, "complete", 5241],
  "CHEM 1211L": ["General Chemistry Laboratory I", 1, "complete", 5242],
  "CHEM 1212":  ["General Chemistry II", 3, "complete", 5243],
  "CHEM 1212L": ["General Chemistry Laboratory II", 1, "complete", 5244],
  "PHYS 1111":  ["Introductory Physics-Mechanics, Waves, Thermodynamics", 4, "complete", 3899],
  "PHYS 1211":  ["Principles of Physics for Scientists and Engineers-Mechanics, Waves, Thermodynamics", 4, "complete", 3908],

    const spots = [{ x: 0, y: Math.max(n.lblY, side + n.lblFs * 0.8), a: "middle" }, { x: 0, y: -side, a: "middle" }, { x: side, y: mid, a: "start" }, { x: -side, y: mid, a: "end" }];
    const tests = spots.map(sp => { const b = box(n, n.lbl, n.lblFs, sp); return { sp, seg: hitsSeg(b), clear: !hitsLabel(b) && !hitsNode(b, n) }; });
    let pick = tests.find(t => t.clear && !t.seg);
    if (!pick && forced(n)) pick = tests.find(t => !t.seg) || tests[0];
    if (!pick) continue;
    const sp = pick.sp, key = `${sp.x},${sp.y},${sp.a}`;
    if (n.lbl._k !== key) { n.lbl.setAttribute("x", sp.x); n.lbl.setAttribute("y", sp.y); n.lbl.setAttribute("text-anchor", sp.a); n.lbl._k = key; }
    boxes.push(box(n, n.lbl, n.lblFs, sp)); placed.add(n.id);
  }
  return placed;
}

function select(id, center) {
  state.sel = id && ITEMS.has(id) ? id : null;
  applyState();
  if (center && state.sel) centerOn(state.sel);
}

/* =====================================================================
   PAN / ZOOM / DRAG / HOVER
   ===================================================================== */
const view = { k: 1, x: 0, y: 0 };
function applyView() {
  const t = `translate(${view.x},${view.y}) scale(${view.k})`;
  if (R.vp) R.vp.setAttribute("transform", t);
}
let anim = null;
function animateTo(k, x, y) {
  cancelAnimationFrame(anim);
  const from = { ...view }, t0 = performance.now(), D = reduced ? 1 : 420;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - t0) / D)), e = 1 - Math.pow(1 - t, 3); // rAF time can precede t0
    view.k = from.k + (k - from.k) * e; view.x = from.x + (x - from.x) * e; view.y = from.y + (y - from.y) * e;
    applyView();
    if (t < 1) anim = requestAnimationFrame(step); else applyVisual();
  };
  anim = requestAnimationFrame(step);
}
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of SIM.nodes) {
    const m = n.it.type === "block" ? n.r + 56 : n.r + 36;
    x0 = Math.min(x0, n.x - m); x1 = Math.max(x1, n.x + m); y0 = Math.min(y0, n.y - m); y1 = Math.max(y1, n.y + m + (n.it.type === "block" ? 10 : 0));
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function fit(animate = true) {
  const b = bounds(), r = svg.getBoundingClientRect(), pad = 20;
  if (r.width < 100 || r.height < 100) return; // hidden (planner view) or not laid out yet
  // Keep the legend clear of the graph: reserve its width on the left or its height at the bottom, whichever leaves the bigger graph.
  const lg = document.querySelector(".legend"), shown = lg && lg.offsetParent;
  const lw = shown ? lg.offsetWidth + 14 : 0, lh = shown ? lg.offsetHeight + 14 : 0;
  const opts = [[lw, r.width - lw, r.height], [0, r.width, r.height - lh]].map(([x0, w, h]) => ({ x0, w: w - pad * 2, h: h - pad * 2, k: Math.min((w - pad * 2) / b.w, (h - pad * 2) / b.h, 1.2) }));
  const o = opts[0].k >= opts[1].k ? opts[0] : opts[1], k = Math.max(0.15, o.k);
  const x = o.x0 + pad + (o.w - b.w * k) / 2 - b.x * k, y = pad + (o.h - b.h * k) / 2 - b.y * k;
  animate ? animateTo(k, x, y) : (Object.assign(view, { k, x, y }), applyView(), applyVisual());
}
function centerOn(id) {
  const n = SIM.byId.get(id); if (!n) return;
  const r = svg.getBoundingClientRect(), k = Math.max(view.k, 1);
  animateTo(k, r.width / 2 - n.x * k, r.height / 2 - n.y * k);
}
function zoomBy(f, mx, my) {
  cancelAnimationFrame(anim); // a running fit/center animation would otherwise undo this zoom
  const r = svg.getBoundingClientRect();
  if (mx == null) { mx = r.width / 2; my = r.height / 2; }
  const k2 = Math.min(3, Math.max(0.15, view.k * f));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2;
  applyView(); applyVisual();
}
svg.addEventListener("wheel", e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const r = svg.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

const nodeAt = e => { const g = e.target.closest && e.target.closest(".node"); return g ? g.getAttribute("data-id") : null; };
const toWorld = (cx, cy) => { const r = svg.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
let drag = null;
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  cancelAnimationFrame(anim);
  const id = nodeAt(e);
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, pid: e.pointerId, node: id ? SIM.byId.get(id) : null };
});
svg.addEventListener("pointermove", e => {
  if (drag && drag.pid === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add("panning"); hideTip();
      if (drag.node) { SIM.alphaTarget = 0.25; heat(0.3); }
    }
    if (!drag.moved) return;
    if (drag.node) {
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      const n = drag.node; n.fx = wx; n.fy = wy; n.jx = n.jy = n.jvx = n.jvy = 0;
      requestLoop();
    } else { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
    return;
  }
  const id = nodeAt(e);
  if (id !== state.hover) {
    state.hover = id;
    if (id) jiggle(SIM.byId.get(id));
    applyVisual(); requestLoop();
  }
  id ? showTip(id, e) : hideTip();
});
svg.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null; svg.classList.remove("panning");
  if (d.moved) {
    if (d.node) { if (d.node.id !== "DEGREE") d.node.fx = d.node.fy = null; SIM.alphaTarget = 0; heat(0.1); }
    return;
  }
  select(nodeAt(e));
});
svg.addEventListener("pointerleave", () => { hideTip(); if (state.hover && !drag) { state.hover = null; applyVisual(); requestLoop(); } });

/* Tooltip */
const tip = document.getElementById("tooltip");
function showTip(id, e) {
  const it = ITEMS.get(id), r = document.getElementById("stage").getBoundingClientRect();
  const bs = blocksOf(id), sections = (bs.length > 1 ? `Counts toward ${bs.length} sections:<br>` : "") + bs.map(b => swatch(b) + esc(ITEMS.get(b).short)).join("<br>");
  let html = "";
  if (it.type === "course") {
    const e2 = elig(id);
    html = `<b>${id}</b> · ${it.credits} cr${state.redact ? "" : `<div class="t">${esc(it.title)}</div>`}<div>${STATUS_LABEL[it.status]}${e2 === "now" ? " · eligible now" : e2 === "next" ? " · eligible after this term" : ""}</div><div class="secs">${sections}</div>`;
  } else if (it.type === "block") html = `<b>${esc(it.label)}</b><div class="t">${STATUS_LABEL[it.status]} (derived from its items)</div>`;
  else if (it.type === "degree") html = `<b>${esc(it.label)}</b><div class="t">${credComplete + credIP} of ${DEGREE.req} credits applied</div>`;
  else html = `<b>${esc(it.label)}</b><div class="t">${esc(it.type === "choice" ? "Pick 1 of " + it.options.length : it.sub)}</div><div>${STATUS_LABEL[it.status]}</div><div class="secs">${sections}</div>`;

const panel = document.getElementById("panel");
const swatch = b => `<span class="sw" style="background:${secColor(b)}"></span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function chip(id) {

  if (it.type === "block") return `<button class="chip" data-go="${esc(id)}">${swatch(id)}${esc(it.short)}</button>`;
  const name = it.type === "course" ? it.id : it.label;
  return `<button class="chip" data-go="${esc(id)}"><span class="dot ${it.status}"></span>${esc(name)}</button>`;
}
const pill = s => `<span class="pill ${s}">${STATUS_LABEL[s]}</span>`;
const eligPill = e => e === "now" ? `<span class="pill elig">Eligible now</span>` : e === "next" ? `<span class="pill elig" style="border-style:dashed">Eligible after this term</span>` : e === "blocked" ? `<span class="pill muted">Prerequisites not met</span>` : "";
const ELIG_TEXT = { now: "Now", next: "After this term", blocked: "Not yet" };
// In redact mode the audit's requirement-line names are hidden too: for required courses they are the course titles.
const membersHTML = id => `<ul>${(MEMBER.get(id) || []).map(m => `<li>${swatch(m.block)}<button class="linkbtn" data-go="${m.block}">${esc(ITEMS.get(m.block).short)}</button>${state.redact ? "" : `<span class="req">${esc(m.req)}</span>`}</li>`).join("")}</ul>`;

function groupsHTML(groups) {
  return groups.map((g, i) => {
    const sts = g.filter(c => ITEMS.has(c)).map(c => ITEMS.get(c).status);
    const ok = sts.includes("complete") ? ["good", "✓ Met"] : sts.includes("in_progress") ? ["text", "In progress"] : ["muted", "Not met"];
    const chips = g.map(chip).join(`<span class="or">or</span>`);
    return (i ? `<div class="and">and</div>` : "") + `<div class="group">${chips}<span class="ok" style="color:var(--${ok[0]})">${ok[1]}</span></div>`;
  }).join("");
}

function renderPanel() {
  const id = state.sel;
  if (!id) return panel.innerHTML = overviewHTML();
  const it = ITEMS.get(id);
  let h = "";
  if (it.type === "course") {
    const p = PRE[id], e = elig(id), shared = blocksOf(id).length;
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap">${pill(it.status)}${eligPill(e)}</div>`;
    h += `<h2>${esc(id)}</h2>${state.redact ? "" : `<p class="title">${esc(it.title)}</p>`}`;
    h += `<dl class="facts"><div><dt>Credits</dt><dd>${it.credits}</dd></div><div><dt>Status</dt><dd>${STATUS_LABEL[it.status]}</dd></div><div><dt>Can take</dt><dd>${it.status === "needed" ? ELIG_TEXT[e] : "—"}</dd></div></dl>`;
    h += plannedHTML(id);
    h += `<h3>Counts toward${shared > 1 ? ` · shared by ${shared} sections` : ""}</h3>${membersHTML(id)}`;
    h += `<h3>Prerequisites</h3>`;
    if (p && p.pre) h += groupsHTML(p.pre) + `<p class="src">Bulletin${p.undergrad ? " (undergraduate prerequisite)" : ""}: ${esc(p.text)}</p>`;
    else h += `<p class="note">${it.bid ? "None listed in the Bulletin." : "Transfer / test-credit placeholder; not a Bulletin course."}</p>`;
    if (p && p.preco) h += `<h3>Pre- or corequisite</h3>${groupsHTML(p.preco)}<p class="src">Bulletin: ${esc(p.precoText)}</p>`;
    if (p && p.coText) h += `<h3>Corequisite</h3><div class="chips">${chip(p.coText)}</div>`;
    const outs = OUT.get(id) || [], down = closure(id, "down").nodes;
    h += `<h3>Unlocks</h3>`;
    h += outs.length ? `<div class="chips">${outs.map(o => chip(o.t)).join("")}</div><p class="note">Green arrows show these direct unlocks${down.size > outs.length ? `; ${down.size} item${down.size === 1 ? "" : "s"} depend on it further down the chain` : ""}.</p>` : `<p class="note">Nothing in this audit lists ${esc(id)} as a prerequisite.</p>`;
    if (it.bid) h += `<p style="margin-top:16px"><a class="ext" href="https://bulletin.uga.edu/Course/Details/${it.bid}" target="_blank" rel="noopener">View in UGA Bulletin ↗</a></p>`;
  } else if (it.type === "req") {
    h += `<div>${pill(it.status)}</div><h2>${esc(it.label)}</h2><p class="title">${esc(it.sub)}</p>`;
    h += plannedHTML(id);
    h += `<h3>Counts toward</h3>${membersHTML(id)}`;
    h += `<h3>From the audit</h3><p>${esc(it.desc)}</p>`;
    if (it.from) {
      const done = it.from.filter(c => ITEMS.get(c).status === "complete").length, ip = it.from.filter(c => ITEMS.get(c).status === "in_progress").length;
      h += `<h3>Entrance courses: ${done} of ${it.from.length} complete${ip ? `, ${ip} in progress` : ""}</h3><div class="chips">${it.from.map(chip).join("")}</div>`;
    }
  } else if (it.type === "choice") {
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap">${pill(it.status)}${eligPill(elig(id))}</div><h2>${esc(it.label)}</h2><p class="title">Pick 1 of ${it.options.length}</p>`;
    h += plannedHTML(id);
    h += `<h3>Options</h3><ul>${it.options.map(o => `<li>${chip(o)}${state.redact ? "" : `<span class="req">${esc(ITEMS.get(o).title)}</span>`}<span style="margin-left:auto">${eligPill(elig(o))}</span></li>`).join("")}</ul>`;
    if (id === "CHOICE:APP") h += `<p class="note">Both options also satisfy the major's Teamwork requirement.</p>`;
  } else if (it.type === "block") {
    const shared = it.childIds.filter(c => blocksOf(c).length > 1);
    h += `<div>${pill(it.status)} <span class="pill muted">Audit: ${esc(it.audit || (it.counts === false ? "not counted" : "—"))}</span></div><h2>${swatch(it.id)}${esc(it.short)}</h2><p class="title">${esc(it.label)} · ${esc(FAMILY_LABEL[FAMILY[it.id]])}</p>`;
    if (it.applied != null) h += `<dl class="facts"><div><dt>Required</dt><dd>${it.req != null ? esc(it.req) + " cr" : "—"}</dd></div><div><dt>Applied</dt><dd>${it.applied} cr</dd></div><div><dt>Items</dt><dd>${it.childIds.length}</dd></div></dl>`;
    h += `<h3>Requirements</h3><ul>${it.items.map(([cid, req]) => `<li>${chip(cid)}${state.redact && ITEMS.get(cid).type === "course" ? "" : `<span class="req">${esc(req)}</span>`}</li>`).join("")}</ul>`;
    if (shared.length) h += `<h3>Shared with other sections</h3><ul>${shared.map(c => `<li>${chip(c)}<span class="req">${blocksOf(c).filter(b => b !== it.id).map(b => swatch(b) + esc(ITEMS.get(b).short)).join(", ")}</span></li>`).join("")}</ul>`;
    if (it.notes) h += `<h3>Notes from the audit</h3>${it.notes.map(n => `<p class="note">${esc(n)}</p>`).join("")}`;
    h += `<p class="note" style="margin-top:14px">Section status is derived from its items: all complete → complete; some started → in progress; none started → needed.</p>`;
  } else {
    h += overviewHTML();
  }
  panel.innerHTML = h + `<p class="hint"><button class="linkbtn" data-go="">← Back to overview</button> &nbsp;or press <kbd>Esc</kbd></p>`;
}

function overviewHTML() {
  const all = [...ITEMS.values()];
  const now = [...ELIG].filter(([id, e]) => e === "now" && ITEMS.get(id).type === "course").map(([id]) => id);
  const next = [...ELIG].filter(([id, e]) => e === "next" && ITEMS.get(id).type === "course").map(([id]) => id);
  const required = BLOCKS.flatMap(b => b.items.map(i => i[0])).filter((v, i, a) => a.indexOf(v) === i);
  const reqCourses = required.filter(id => ITEMS.get(id).type === "course" && ITEMS.get(id).status === "needed");
  const groups = required.filter(id => ITEMS.get(id).type === "choice" && ITEMS.get(id).status === "needed");
  const open = required.filter(id => ITEMS.get(id).type === "req");
  const inProg = all.filter(i => i.type === "course" && i.status === "in_progress").map(i => i.id);
  const shared = all.filter(i => i.type !== "block" && i.type !== "degree" && blocksOf(i.id).length > 1).map(i => i.id);
  let h = `<h2 style="font-size:20px">Overview</h2><p class="intro">A graph of your college curriculum. Your degree sits at the center, linked to each section of your degree audit, and each section is linked to the classes that count toward it. Color shows the type of requirement and fill shows your progress. Click any class to see what it requires and what it unlocks.</p>`;
  h += `<h3>Sections (${BLOCKS.length})</h3><div class="chips">${BLOCKS.map(b => chip(b.id)).join("")}</div>`;
  h += `<h3>Eligible now (${now.length})</h3>` + (now.length ? `<div class="chips">${now.map(chip).join("")}</div><p class="note">Needed, and every prerequisite is complete.</p>` : `<p class="note">None.</p>`);
  h += `<h3>Eligible after this term (${next.length})</h3>` + (next.length ? `<div class="chips">${next.map(chip).join("")}</div><p class="note">Unlocks once your in-progress courses finish.</p>` : `<p class="note">None.</p>`);
  h += `<h3>In progress (${inProg.length})</h3><div class="chips">${inProg.map(chip).join("")}</div>`;
  h += `<h3>Required courses still needed (${reqCourses.length})</h3><div class="chips">${reqCourses.map(chip).join("")}</div>`;
  h += `<h3>Pick-one groups (${groups.length})</h3><div class="chips">${groups.map(chip).join("")}</div>`;
  h += `<h3>Open requirements (${open.length})</h3><div class="chips">${open.map(chip).join("")}</div>`;
  h += `<h3>Counted in more than one section (${shared.length})</h3><div class="chips">${shared.map(chip).join("")}</div>`;
  h += `<h3>Degree checks from the audit</h3><ul>${DEGREE.checks.map(([a, b]) => `<li><b>${esc(a)}</b><span class="req">${esc(b)}</span></li>`).join("")}</ul>`;
  h += `<p class="hint">${esc(PROF.source)}. Arrows are drawn only between courses in this audit; other accepted alternatives appear as dashed chips in each course's details.<br><br>Hover to nudge · drag nodes to rearrange · scroll to zoom<br>Shortcuts: <kbd>/</kbd> search · <kbd>F</kbd> fit · <kbd>Esc</kbd> clear</p>`;
  return h;
}
function plannedHTML(id) {
  if (typeof PLANNED_TERM === "undefined" || !PLANNED_TERM.size) return "";
  let list = [];
  if (id === "REQ:FL") list = PLANNED_TERM.has(FL_COURSE) ? [[FL_COURSE, PLANNED_TERM.get(FL_COURSE)]] : [];
  else if (id === "REQ:MAJEL") list = PLAN.items.filter(it => it.role === "elective").map(it => [it.id, PLANNED_TERM.get(it.id)]);
  else if (CHOICES[id]) list = CHOICES[id].options.filter(o => PLANNED_TERM.has(o) && PLAN.items.find(it => it.id === o).role !== "elective").map(o => [o, PLANNED_TERM.get(o)]);
  else if (PLANNED_TERM.has(id)) list = [[null, PLANNED_TERM.get(id)]];
  if (!list.length) return "";
  return `<div class="planned">Planned: ${list.map(([c, t]) => `${c ? esc(c) + " in " : ""}<b>${esc(t)}</b>`).join(", ")} · <button class="linkbtn" data-openplan>Open semester plan</button></div>`;
}
panel.addEventListener("click", e => {
  if (e.target.closest("[data-openplan]")) return setMode("plan");

function renderLegend() {
  const pal = P(), blue = [pal.fam.cs], green = [pal.fam.gen];

  const glyph = (w, h, draw) => { const sv = document.createElementNS(NS, "svg"); sv.setAttribute("width", w); sv.setAttribute("height", h); sv.setAttribute("viewBox", `${-w / 2} ${-h / 2} ${w} ${h}`); sv.setAttribute("font-family", FONT); draw(sv); return sv.outerHTML; };
  // Node-kind symbols on their own (the same + and ◇ drawn inside those nodes), scaled up to read at legend size.
  const symbol = (d, col) => glyph(30, 30, g => el("path", { d, transform: "scale(1.5)", fill: "none", stroke: col, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g));
  const node = (o, size = 30) => glyph(size, size, g => nodeMarks(g, { r: 9, kind: "course", status: "complete", cols: blue, ...o }));
  const edge = (st, col = pal.edge, arrow = true) => glyph(40, 14, g => {
    el("line", { x1: -18, y1: 0, x2: arrow ? 9 : 18, y2: 0, stroke: col, "stroke-width": st.w, "stroke-dasharray": st.dash, "stroke-linecap": st.cap || "butt" }, g);
    if (arrow) el("path", { d: "M8,-4.5 L18,0 L8,4.5 Z", fill: col }, g);
  });
  // A labelled sub-block inside a section (used to separate class progress from section progress).
  const sub = (label, rows) => `<div class="lg-sub">${label}</div><div class="grid">${rows.map(([sv, l]) => `<div class="it">${sv}<span>${l}</span></div>`).join("")}</div>`;
  const group = (h, rows, note) => `<div><div class="lg-h">${h}</div>${note ? `<div class="lg-note">${note}</div>` : ""}<div class="grid">${rows.map(([sv, l]) => `<div class="it">${sv}<span>${l}</span></div>`).join("")}</div></div>`;
  const hub = glyph(34, 34, g => progressRing(g, 12, 5, [[2, pal.fam.cs], [1, pal.fam.cs, 0.4], [1, "none"]], pal));
  document.getElementById("legend").innerHTML =
    group("Color = Requirement type", [
      [node({ cols: blue }), "Major / CS"],
      [node({ cols: green }), "Gen ed / university / college"],
      [node({ cols: [pal.fam.other] }), "Electives / excess"],
      [node({ cols: [pal.fam.cs, pal.fam.gen] }), "Counts toward two types"],
    ])
    + group("Symbol = Special requirement", [
      [symbol("M-5 0 H5 M0 -5 V5", pal.fam.gen), "Open requirement (+)"],
      [symbol("M0 -5.5 L5.5 0 L0 5.5 L-5.5 0 Z", pal.fam.cs), "Choose one of the options"],
    ])
    + `<div><div class="lg-h">Fill = Progress</div>`
    + sub("Classes", [
      [node({ status: "needed" }), "Needed (empty)"],
      [node({ status: "in_progress" }), "In progress (half)"],
      [node({ status: "complete" }), "Complete (full)"],
    ])
    + sub("Degree/Individual Sections", [
      [hub, "Solid: completed<br>Translucent: in-progress"],
    ]) + `</div>`
    + group("Outer ring = Availability", [
      [node({ status: "needed", elig: "now" }), "Eligible now"],
      [node({ status: "needed", elig: "next" }), "Eligible after this term"],
      [node({ status: "needed" }), "Blocked (no ring)"],
    ], "Needed courses only")
    + group("Line style = Relationship", [
      [edge({ w: 1.3 }, pal.edge, false), "Belongs to a section"],
      [edge({ w: PRE_STYLE.prereq.w + 1.2 }, pal.up), "Prerequisite"],
      [edge({ w: COREQ.w + 1.2, dash: COREQ.dash }, pal.up), "Pre- or corequisite"],
      [edge({ w: PRE_STYLE.prereq.w + 1.2 }, pal.down), "Unlocks"],
    ]);
}

/* Search */
const search = document.getElementById("search");
function fillDatalist() {
  document.getElementById("courseList").innerHTML = [...ITEMS.values()]
    .filter(i => i.type === "course" || i.type === "req" || i.type === "choice")
    .map(i => `<option value="${esc(i.type === "course" ? i.id : i.label)}">${i.type === "course" && !state.redact ? esc(i.title) : ""}</option>`).join("");
}
function findItem(q) {
  const k = q.toUpperCase().replace(/\s+/g, "");
  if (!k) return null;
  const name = it => it.type === "course" ? it.id : it.type === "block" ? it.short : it.label;
  for (const it of ITEMS.values()) if (name(it).toUpperCase().replace(/\s+/g, "") === k) return it.id;
  for (const it of ITEMS.values()) {
    const hay = (name(it) + (it.type === "course" && !state.redact ? " " + it.title : "") + (it.type === "block" ? " " + it.label : "")).toUpperCase();
    if (hay.replace(/\s+/g, "").includes(k)) return it.id;
  }
  return null;
}
function doSearch() {
  const id = findItem(search.value);
  if (id) select(id, true);
  else if (search.value.trim()) { search.style.outline = "2px solid #e11d48"; setTimeout(() => search.style.outline = "", 900); }
}
search.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
search.addEventListener("change", doSearch);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") { e.target.blur(); select(null); } return; }
  if (e.key === "Escape") select(null);
  else if (e.key === "/") { e.preventDefault(); search.focus(); }
  else if (e.key === "f" || e.key === "F") fit();
  else if (e.key === "+" || e.key === "=") zoomBy(1.25);
  else if (e.key === "-") zoomBy(0.8);
});

/* Export the current view as PNG */
document.getElementById("export").addEventListener("click", () => {
  const r = svg.getBoundingClientRect(), scale = 2;
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", NS);
  clone.setAttribute("width", r.width); clone.setAttribute("height", r.height);
  clone.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  clone.querySelectorAll("animate").forEach(a => a.parentNode.remove());
  clone.querySelectorAll(".node,.edge,.selring").forEach(n => n.removeAttribute("class"));
  const data = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    // A shared image carries its own title, key and sources, since the page around it is gone.
    const pal = P(), top = 64, bottom = 40, H = r.height + top + bottom;
    const c = document.createElement("canvas");
    c.width = r.width * scale; c.height = H * scale;
    const ctx = c.getContext("2d");
    ctx.scale(scale, scale); ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, r.width, H);
    ctx.drawImage(img, 0, top, r.width, r.height);
    ctx.fillStyle = pal.text; ctx.font = `700 20px ${FONT}`;
    ctx.fillText(`${DEGREE.label}: Degree Map`, 20, 30);
    ctx.fillStyle = pal.muted; ctx.font = `13px ${FONT}`;
    ctx.fillText(`${credComplete + credIP} of ${DEGREE.req} credits applied · Blue = major (CS), green = gen ed, gray = electives & excess · Full = complete, half = in progress, empty = needed · Outer ring = eligible (solid now, dashed next term) · Circle area = credit hours`
      + (state.sel ? ` · Tracing ${state.sel}: yellow = requires, green = unlocks` : ""), 20, 52);
    ctx.fillText(`Profile: ${PROF.name} · ${PROF.source}. Planning aid, not an official audit.`, 20, H - 16);
    c.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `degree-map${state.redact ? "-redacted" : ""}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data);
});
